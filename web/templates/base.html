<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DSU Policy Lab{% endblock %}</title>
  <style>
    :root {
      --bg: #f7f7f5; --surface: #ffffff; --text: #1d1d1b; --muted: #5f5f5a;
      --border: #dcdcd6; --accent: #0b4f9c; --accent-text: #ffffff; --error: #a8261b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615; --surface: #20201e; --text: #ececea; --muted: #a3a39e;
        --border: #3a3a37; --accent: #6aa5ea; --accent-text: #0e0e0d; --error: #ff8a7e;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
    header .brand { font-weight: 600; color: var(--text); text-decoration: none; margin-right: auto; }
    header .who { color: var(--muted); font-size: 14px; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    a { color: var(--accent); }
    h1 { font-size: 26px; line-height: 1.25; margin: 0 0 12px; }
    h2 { font-size: 19px; margin: 28px 0 8px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 12px 0; }
    .muted { color: var(--muted); }
    .error { color: var(--error); }
    .messages { list-style: none; padding: 0; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type=email], textarea { width: 100%; padding: 10px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
    textarea { min-height: 220px; resize: vertical; }
    button, a.button { display: inline-block; font: inherit; padding: 9px 18px; border-radius: 6px; border: 0; background: var(--accent); color: var(--accent-text); cursor: pointer; text-decoration: none; }
    button.link { background: none; color: var(--accent); padding: 0; }
    .agent .status { font-size: 14px; color: var(--muted); }
    .agent .text { white-space: pre-wrap; margin-top: 8px; }
    .prompt { white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{% url 'sims:scenario_list' %}">DSU Policy Lab</a>
    {% if user.is_authenticated %}
      <span class="who">{{ user.email }}</span>
      {% if user.is_staff %}<a href="{% url 'admin:index' %}">Admin</a>{% endif %}
      <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="link">Sign out</button></form>
    {% endif %}
  </header>
  <main>
    {% if messages %}
      <ul class="messages">{% for message in messages %}<li class="error">{{ message }}</li>{% endfor %}</ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>

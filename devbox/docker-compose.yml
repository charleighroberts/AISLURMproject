# Blank SSH box for teammates:  ssh -p 2222 <name>@<host>
#   docker compose -f devbox/docker-compose.yml up -d --build
name: policylab-devbox

services:
  devbox:
    build: .
    hostname: policylab-devbox
    ports: ["2222:22"]
    cap_add: [NET_ADMIN]   # only for the entrypoint's firewall; dropped before SSH starts
    volumes:
      - home:/home
      - hostkeys:/etc/ssh/keys
      - ./keys:/config/keys:ro
    restart: unless-stopped

volumes:
  home:
  hostkeys:

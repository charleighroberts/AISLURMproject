# Host keys live in a volume so they survive rebuilds (no "host key changed" warnings for teammates).
HostKey /etc/ssh/keys/ssh_host_ed25519_key
HostKey /etc/ssh/keys/ssh_host_rsa_key

# Keys only. The entrypoint writes one root-owned key file per keys/<username>.pub, so users can't add logins.
PubkeyAuthentication yes
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
PasswordAuthentication no
KbdInteractiveAuthentication no

# Only team accounts, never root.
AllowGroups devbox
PermitRootLogin no

# This port is open to the internet.
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 5:50:20
X11Forwarding no

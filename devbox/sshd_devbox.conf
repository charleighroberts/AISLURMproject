# Host keys live in a volume so they survive rebuilds (no "host key changed" warnings for teammates).
HostKey /etc/ssh/keys/ssh_host_ed25519_key
HostKey /etc/ssh/keys/ssh_host_rsa_key

# Only the team accounts from passwords.txt, never root.
AllowGroups devbox
PermitRootLogin no
PasswordAuthentication yes
KbdInteractiveAuthentication no

# This port is open to the internet: slow down password guessing.
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 5:50:20
X11Forwarding no
